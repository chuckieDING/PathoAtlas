<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="SMA mechanism: smooth muscle actin filaments">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">SMA · α-平滑肌肌动蛋白</text>

  <!-- Two spindle smooth muscle cells side-by-side -->
  <g>
    <path d="M40 70 Q210 50 380 70 Q210 100 40 70 Z" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6"/>
    <ellipse cx="210" cy="75" rx="14" ry="6" fill="#7f1d1d"/>
  </g>
  <g>
    <path d="M40 130 Q210 110 380 130 Q210 160 40 130 Z" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6"/>
    <ellipse cx="210" cy="135" rx="14" ry="6" fill="#7f1d1d"/>
  </g>
  <g>
    <path d="M40 190 Q210 170 380 190 Q210 220 40 190 Z" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6"/>
    <ellipse cx="210" cy="195" rx="14" ry="6" fill="#7f1d1d"/>
  </g>

  <!-- Thin actin filaments within cells -->
  <g stroke="#dc2626" stroke-width="1.2" fill="none">
    <path d="M60 68 Q210 58 360 68"/>
    <path d="M60 75 Q210 65 360 75"/>
    <path d="M60 82 Q210 72 360 82"/>
    <path d="M60 128 Q210 118 360 128"/>
    <path d="M60 135 Q210 125 360 135"/>
    <path d="M60 142 Q210 132 360 142"/>
    <path d="M60 188 Q210 178 360 188"/>
    <path d="M60 195 Q210 185 360 195"/>
    <path d="M60 202 Q210 192 360 202"/>
  </g>

  <!-- Tag: α-SMA -->
  <g transform="translate(290 230)">
    <rect width="110" height="20" rx="5" fill="#fff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="55" y="14" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#7f1d1d" font-weight="700">α-SMA 胞浆微丝</text>
  </g>

  <!-- Cell types benefitting -->
  <g font-family="system-ui, sans-serif" font-size="9" fill="#7c2d12">
    <text x="16" y="240">① 平滑肌细胞  ② 乳腺/涎腺肌上皮  ③ 肌纤维母细胞</text>
  </g>
</svg>
