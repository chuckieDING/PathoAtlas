<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="HER2 mechanism: receptor dimerization and RTK signaling">
  <defs>
    <linearGradient id="her2-mem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">HER2 · 受体酪氨酸激酶信号</text>

  <!-- Extracellular -->
  <rect x="0" y="40" width="420" height="70" fill="#dbeafe" opacity="0.5"/>
  <text x="405" y="58" font-family="system-ui, sans-serif" font-size="9" text-anchor="end" fill="#1d4ed8">细胞外 Extracellular</text>

  <!-- Plasma membrane -->
  <rect x="0" y="110" width="420" height="24" fill="url(#her2-mem)"/>
  <g stroke="#92400e" stroke-width="0.4">
    <circle cx="20" cy="122" r="3" fill="#fde68a"/><circle cx="50" cy="122" r="3" fill="#fde68a"/>
    <circle cx="80" cy="122" r="3" fill="#fde68a"/><circle cx="110" cy="122" r="3" fill="#fde68a"/>
    <circle cx="200" cy="122" r="3" fill="#fde68a"/><circle cx="260" cy="122" r="3" fill="#fde68a"/>
    <circle cx="340" cy="122" r="3" fill="#fde68a"/><circle cx="380" cy="122" r="3" fill="#fde68a"/>
  </g>

  <!-- Cytoplasm -->
  <rect x="0" y="134" width="420" height="126" fill="#fff7ed" opacity="0.4"/>
  <text x="405" y="150" font-family="system-ui, sans-serif" font-size="9" text-anchor="end" fill="#9a3412">细胞质 Cytoplasm</text>

  <!-- HER2 homodimer -->
  <g>
    <path d="M140 70 L140 110" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
    <path d="M170 70 L170 110" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
    <rect x="132" y="134" width="18" height="30" fill="#dc2626" rx="3"/>
    <rect x="162" y="134" width="18" height="30" fill="#dc2626" rx="3"/>
    <text x="155" y="85" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#fff" font-weight="700">HER2</text>
    <text x="155" y="95" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#fff" font-weight="700">HER2</text>
    <!-- P tyrosines -->
    <circle cx="128" cy="170" r="5" fill="#fbbf24" stroke="#d97706"/>
    <text x="128" y="173" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#7c2d12" font-weight="700">P</text>
    <circle cx="184" cy="170" r="5" fill="#fbbf24" stroke="#d97706"/>
    <text x="184" y="173" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#7c2d12" font-weight="700">P</text>
    <text x="155" y="195" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#7f1d1d">同源二聚体</text>
  </g>

  <!-- Trastuzumab Y-shaped antibody -->
  <g transform="translate(250 55)">
    <path d="M0 0 L10 20 L20 0" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M10 20 L10 40" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <text x="10" y="55" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#065f46" font-weight="600">曲妥珠单抗</text>
  </g>
  <!-- Antibody binding HER2 -->
  <path d="M240 85 L186 85" stroke="#047857" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>

  <!-- Downstream signals -->
  <g font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">
    <circle cx="225" cy="200" r="14" fill="#fecaca" stroke="#dc2626"/>
    <text x="225" y="203" fill="#7f1d1d">RAS</text>
    <circle cx="265" cy="225" r="14" fill="#fecaca" stroke="#dc2626"/>
    <text x="265" y="228" fill="#7f1d1d">MAPK</text>
    <circle cx="315" cy="200" r="14" fill="#fde68a" stroke="#d97706"/>
    <text x="315" y="203" fill="#78350f">PI3K</text>
    <circle cx="355" cy="225" r="14" fill="#fde68a" stroke="#d97706"/>
    <text x="355" y="228" fill="#78350f">AKT</text>
  </g>
  <g stroke="#7f1d1d" stroke-width="1.2" fill="none" stroke-dasharray="3 2">
    <path d="M175 180 Q200 190 215 195"/>
    <path d="M188 180 Q240 190 305 195"/>
    <path d="M238 212 L252 218"/>
    <path d="M328 212 L342 218"/>
  </g>

  <!-- Effect -->
  <text x="16" y="252" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">
    基因扩增 → 受体过表达 → 配体非依赖性二聚化 → 下游 RAS-MAPK / PI3K-AKT 激活 → 增殖&amp;生存
  </text>
</svg>
