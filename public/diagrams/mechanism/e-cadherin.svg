<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="E-cadherin mechanism: homophilic cell-cell adhesion">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">E-cadherin · 上皮细胞黏附连接</text>

  <!-- Two adjacent cells -->
  <rect x="20" y="50" width="170" height="190" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="230" y="50" width="170" height="190" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="105" y="70" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#14532d" font-weight="600">上皮细胞 A</text>
  <text x="315" y="70" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#14532d" font-weight="600">上皮细胞 B</text>

  <!-- Membranes facing each other -->
  <line x1="190" y1="50" x2="190" y2="240" stroke="#065f46" stroke-width="2.5"/>
  <line x1="230" y1="50" x2="230" y2="240" stroke="#065f46" stroke-width="2.5"/>

  <!-- E-cadherin dimers across junction -->
  <g>
    <!-- Left cadherin -->
    <path d="M190 100 L205 100 L212 110 L205 120 L190 120 Z" fill="#0ea5e9" stroke="#075985" stroke-width="1.3"/>
    <!-- Right cadherin -->
    <path d="M230 100 L215 100 L208 110 L215 120 L230 120 Z" fill="#0ea5e9" stroke="#075985" stroke-width="1.3"/>
    <!-- Ca2+ -->
    <circle cx="210" cy="110" r="3.2" fill="#f59e0b"/>

    <path d="M190 150 L205 150 L212 160 L205 170 L190 170 Z" fill="#0ea5e9" stroke="#075985" stroke-width="1.3"/>
    <path d="M230 150 L215 150 L208 160 L215 170 L230 170 Z" fill="#0ea5e9" stroke="#075985" stroke-width="1.3"/>
    <circle cx="210" cy="160" r="3.2" fill="#f59e0b"/>

    <path d="M190 200 L205 200 L212 210 L205 220 L190 220 Z" fill="#0ea5e9" stroke="#075985" stroke-width="1.3"/>
    <path d="M230 200 L215 200 L208 210 L215 220 L230 220 Z" fill="#0ea5e9" stroke="#075985" stroke-width="1.3"/>
    <circle cx="210" cy="210" r="3.2" fill="#f59e0b"/>
  </g>
  <text x="210" y="90" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#075985" font-weight="700">E-cadherin (Ca²⁺依赖)</text>

  <!-- Intracellular catenin complex -->
  <g>
    <circle cx="160" cy="110" r="7" fill="#a855f7" stroke="#6b21a8" stroke-width="1.2"/>
    <text x="160" y="113" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle" fill="#fff" font-weight="700">β</text>
    <circle cx="145" cy="125" r="7" fill="#c084fc" stroke="#6b21a8" stroke-width="1.2"/>
    <text x="145" y="128" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle" fill="#fff" font-weight="700">α</text>
    <line x1="180" y1="110" x2="167" y2="110" stroke="#6b21a8" stroke-width="1.2"/>
    <!-- Actin wavy -->
    <path d="M140 132 q8 6 14 0 q6 -6 14 0 q8 6 14 0" stroke="#b91c1c" stroke-width="1.8" fill="none"/>
    <text x="155" y="148" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#7c2d12">F-actin</text>

    <circle cx="260" cy="110" r="7" fill="#a855f7" stroke="#6b21a8" stroke-width="1.2"/>
    <text x="260" y="113" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle" fill="#fff" font-weight="700">β</text>
    <circle cx="275" cy="125" r="7" fill="#c084fc" stroke="#6b21a8" stroke-width="1.2"/>
    <text x="275" y="128" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle" fill="#fff" font-weight="700">α</text>
    <line x1="240" y1="110" x2="253" y2="110" stroke="#6b21a8" stroke-width="1.2"/>
    <path d="M252 132 q8 6 14 0 q6 -6 14 0 q8 6 14 0" stroke="#b91c1c" stroke-width="1.8" fill="none"/>
    <text x="270" y="148" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#7c2d12">F-actin</text>
  </g>

  <!-- Loss arrow to ILC (Indian file) -->
  <g transform="translate(105 195)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="9" fill="#7c2d12" font-weight="600">丢失 →</text>
    <text x="0" y="13" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">小叶癌 / 印戒细胞癌</text>
  </g>

  <text x="16" y="253" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">
    E-cad 胞外结构域同种亲和结合 + 胞内与 β/α-连环蛋白–F-actin 锚定；CDH1 失活 = 膜阳性丢失
  </text>
</svg>
