  <!-- Aberrant B cell (CLL/MCL) -->
  <g>
    <circle cx="300" cy="130" r="50" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="300" y="120" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#78350f" font-weight="700">B cell</text>
    <text x="300" y="135" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#92400e">(CLL / MCL)</text>
    <!-- CD20 spikes (B lineage) -->
    <g fill="#d97706" stroke="#92400e" stroke-width="1.1">
      <rect x="266" y="85" width="7" height="12" rx="1"/>
      <rect x="296" y="78" width="7" height="12" rx="1"/>
      <rect x="326" y="85" width="7" height="12" rx="1"/>
      <rect x="340" y="110" width="7" height="12" rx="1"/>
      <rect x="338" y="145" width="7" height="12" rx="1"/>
      <rect x="320" y="170" width="7" height="12" rx="1"/>
      <rect x="294" y="180" width="7" height="12" rx="1"/>
      <rect x="266" y="170" width="7" height="12" rx="1"/>
      <rect x="252" y="145" width="7" height="12" rx="1"/>
      <rect x="250" y="110" width="7" height="12" rx="1"/>
    </g>
    <!-- Aberrant CD5 on B cell - fewer, in blue -->
    <g fill="#0ea5e9" stroke="#075985" stroke-width="1.3">
      <rect x="280" y="82" width="7" height="12" rx="1"/>
      <rect x="310" y="82" width="7" height="12" rx="1"/>
      <rect x="280" y="175" width="7" height="12" rx="1"/>
    </g>
    <text x="300" y="210" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#075985" font-weight="600">异常 CD5⁺</text>
  </g>

  <!-- Legend / category -->
  <g font-family="system-ui, sans-serif" font-size="9" fill="#7c2d12">
    <text x="16" y="238" font-weight="600">CD5⁺ 惰性 B 系:</text>
    <text x="16" y="252">CLL/SLL (CD23⁺) · 套细胞淋巴瘤 (cyclinD1⁺) · 鉴别边缘带 (CD5⁻)</text>
