      <rect x="114" y="75" width="7" height="12" rx="1"/>
      <rect x="135" y="88" width="7" height="12" rx="1"/>
      <rect x="146" y="115" width="7" height="12" rx="1"/>
      <rect x="140" y="143" width="7" height="12" rx="1"/>
      <rect x="120" y="168" width="7" height="12" rx="1"/>
      <rect x="95" y="178" width="7" height="12" rx="1"/>
      <rect x="68" y="170" width="7" height="12" rx="1"/>
      <rect x="50" y="150" width="7" height="12" rx="1"/>
      <rect x="44" y="125" width="7" height="12" rx="1"/>
