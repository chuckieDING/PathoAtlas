  <!-- Normal T cell -->
  <g>
    <circle cx="100" cy="130" r="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="100" y="120" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#1e3a8a" font-weight="700">T cell</text>
    <!-- CD5 spikes -->
    <g fill="#0ea5e9" stroke="#075985" stroke-width="1.1">
