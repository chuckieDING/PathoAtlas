<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="DOG1 mechanism: calcium-activated chloride channel in ICC">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">DOG1 (ANO1) · Ca²⁺激活氯离子通道</text>

  <!-- Interstitial cell of Cajal outline -->
  <ellipse cx="210" cy="150" rx="170" ry="80" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <!-- Nucleus -->
  <ellipse cx="160" cy="150" rx="22" ry="18" fill="#fde68a" stroke="#92400e" stroke-width="1.4"/>
  <text x="160" y="154" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#78350f" font-weight="700">核</text>
  <text x="210" y="60" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#7c2d12" font-weight="600">Cajal 间质细胞 (ICC) / GIST</text>

  <!-- Plasma membrane arc shown on the right, with DOG1 channel -->
  <g>
    <path d="M330 90 Q395 150 330 210" stroke="#b45309" stroke-width="3" fill="none"/>
    <!-- Channel openings -->
    <rect x="343" y="110" width="22" height="14" rx="3" fill="#0ea5e9" stroke="#075985"/>
    <rect x="352" y="145" width="22" height="14" rx="3" fill="#0ea5e9" stroke="#075985"/>
    <rect x="343" y="180" width="22" height="14" rx="3" fill="#0ea5e9" stroke="#075985"/>
    <text x="400" y="120" font-family="system-ui, sans-serif" font-size="8" text-anchor="end" fill="#075985" font-weight="700">DOG1</text>
  </g>

  <!-- Chloride ions moving out -->
  <g font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">
    <circle cx="355" cy="117" r="4" fill="#22d3ee"/><text x="355" y="120" fill="#075985">Cl⁻</text>
    <circle cx="390" cy="125" r="4" fill="#22d3ee"/><text x="390" y="128" fill="#075985">Cl⁻</text>
    <circle cx="365" cy="153" r="4" fill="#22d3ee"/><text x="365" y="156" fill="#075985">Cl⁻</text>
    <circle cx="395" cy="160" r="4" fill="#22d3ee"/><text x="395" y="163" fill="#075985">Cl⁻</text>
    <circle cx="355" cy="188" r="4" fill="#22d3ee"/><text x="355" y="191" fill="#075985">Cl⁻</text>
  </g>

  <!-- Ca2+ trigger inside cell -->
  <g>
    <circle cx="260" cy="130" r="6" fill="#f59e0b" stroke="#7c2d12"/>
    <text x="260" y="133" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#fff" font-weight="700">Ca²⁺</text>
    <path d="M268 134 L340 155" stroke="#b45309" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#dog-arr)"/>
    <defs>
      <marker id="dog-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
      </marker>
    </defs>
  </g>

  <text x="16" y="248" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    DOG1 (Discovered on GIST-1) = ANO1 氯通道；GIST 敏感性优于 CD117，包括 KIT 阴性 PDGFRA 突变型
  </text>
</svg>
