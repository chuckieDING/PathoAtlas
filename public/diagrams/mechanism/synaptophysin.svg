<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Synaptophysin mechanism: neuroendocrine secretory vesicles">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">Syn / CgA · 神经内分泌颗粒标记</text>

  <!-- Neuroendocrine cell outline -->
  <ellipse cx="210" cy="145" rx="170" ry="95" fill="#f5d0fe" stroke="#a21caf" stroke-width="2"/>
  <ellipse cx="180" cy="140" rx="24" ry="20" fill="#e9d5ff" stroke="#6b21a8" stroke-width="1.4"/>
  <text x="180" y="144" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#581c87" font-weight="700">核</text>
  <text x="210" y="70" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6b21a8" font-weight="600">神经内分泌细胞</text>

  <!-- Large dense-core granules (CgA) -->
  <g>
    <circle cx="260" cy="110" r="11" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>
    <circle cx="260" cy="110" r="6" fill="#78350f"/>
    <circle cx="290" cy="130" r="11" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>
    <circle cx="290" cy="130" r="6" fill="#78350f"/>
    <circle cx="320" cy="100" r="11" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>
    <circle cx="320" cy="100" r="6" fill="#78350f"/>
    <circle cx="240" cy="170" r="11" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>
    <circle cx="240" cy="170" r="6" fill="#78350f"/>
    <circle cx="300" cy="180" r="11" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>
    <circle cx="300" cy="180" r="6" fill="#78350f"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="8.5" fill="#7c2d12">
    <text x="342" y="98" font-weight="700">LDCV</text>
    <text x="342" y="110">嗜铬颗粒蛋白 A</text>
    <text x="342" y="121">(CgA)</text>
    <text x="342" y="135">基质蛋白</text>
  </g>

  <!-- Small synaptic-like vesicles (Syn) -->
  <g fill="#a78bfa" stroke="#5b21b6" stroke-width="1">
    <circle cx="100" cy="100" r="4"/>
    <circle cx="115" cy="115" r="4"/>
    <circle cx="90" cy="130" r="4"/>
    <circle cx="130" cy="95" r="4"/>
    <circle cx="105" cy="180" r="4"/>
    <circle cx="130" cy="195" r="4"/>
    <circle cx="85" cy="165" r="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="8.5" fill="#5b21b6">
    <text x="55" y="88" font-weight="700">SLMV</text>
    <text x="55" y="100">突触小泡样</text>
    <text x="55" y="112">(Synaptophysin</text>
    <text x="55" y="123">膜整合蛋白)</text>
  </g>

  <!-- Arrow from granule to membrane exocytosis -->
  <path d="M330 185 Q360 205 370 225" stroke="#92400e" stroke-width="1.4" fill="none" stroke-dasharray="3 2"/>
  <text x="360" y="240" font-family="system-ui, sans-serif" font-size="8" text-anchor="end" fill="#92400e">胞吐释放激素/肽</text>

  <text x="16" y="253" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    Syn = 小突触样囊泡膜；CgA = 大致密核心颗粒基质；胞浆颗粒状着色 → NET 确诊
  </text>
</svg>
