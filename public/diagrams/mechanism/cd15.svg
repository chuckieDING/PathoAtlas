<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="CD15 mechanism: Lewis X carbohydrate on neutrophils and Hodgkin cells">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">CD15 (Lewis X) · 碳水化合物抗原</text>

  <!-- Left: neutrophil with multilobed nucleus -->
  <g>
    <circle cx="115" cy="145" r="55" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
    <text x="115" y="80" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#075985" font-weight="700">中性粒细胞</text>
    <!-- multilobed nucleus -->
    <g fill="#1e3a8a" stroke="#1e40af" stroke-width="1">
      <ellipse cx="95" cy="130" rx="10" ry="7"/>
      <ellipse cx="120" cy="125" rx="10" ry="7"/>
      <ellipse cx="140" cy="145" rx="10" ry="7"/>
      <ellipse cx="120" cy="165" rx="10" ry="7"/>
      <!-- thin connections -->
      <line x1="104" y1="128" x2="112" y2="126" stroke-width="2"/>
      <line x1="128" y1="128" x2="134" y2="140" stroke-width="2"/>
      <line x1="137" y1="150" x2="128" y2="161" stroke-width="2"/>
    </g>
    <!-- CD15 (Lewis X) carbs on surface -->
    <g>
      <g transform="translate(65 125)">
        <circle r="3" fill="#16a34a"/>
        <circle cx="5" cy="-4" r="3" fill="#fbbf24"/>
        <circle cx="5" cy="4" r="3" fill="#2563eb"/>
      </g>
      <g transform="translate(68 160)">
        <circle r="3" fill="#16a34a"/>
        <circle cx="5" cy="-4" r="3" fill="#fbbf24"/>
        <circle cx="5" cy="4" r="3" fill="#2563eb"/>
      </g>
      <g transform="translate(160 105)">
        <circle r="3" fill="#16a34a"/>
        <circle cx="5" cy="-4" r="3" fill="#fbbf24"/>
        <circle cx="5" cy="4" r="3" fill="#2563eb"/>
      </g>
      <g transform="translate(165 180)">
        <circle r="3" fill="#16a34a"/>
        <circle cx="5" cy="-4" r="3" fill="#fbbf24"/>
        <circle cx="5" cy="4" r="3" fill="#2563eb"/>
      </g>
    </g>
    <text x="115" y="212" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#075985">正常生理性</text>
  </g>

  <!-- Middle: Lewis X structure (three-sugar) -->
  <g transform="translate(225 85)">
    <rect width="90" height="50" rx="6" fill="#fff" stroke="#15803d" stroke-width="1.3"/>
    <text x="45" y="14" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#14532d" font-weight="700">Lewis X</text>
    <circle cx="20" cy="30" r="4" fill="#16a34a"/>
    <text x="20" y="46" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle" fill="#14532d">GlcNAc</text>
    <circle cx="45" cy="30" r="4" fill="#fbbf24"/>
    <text x="45" y="46" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle" fill="#78350f">Gal</text>
    <circle cx="70" cy="30" r="4" fill="#2563eb"/>
    <text x="70" y="46" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle" fill="#1e3a8a">Fuc</text>
    <!-- bonds -->
    <line x1="24" y1="30" x2="41" y2="30" stroke="#6b7280"/>
    <line x1="49" y1="30" x2="66" y2="30" stroke="#6b7280"/>
  </g>

  <!-- Right: R-S cell -->
  <g>
    <circle cx="335" cy="165" r="45" fill="#fecaca" stroke="#991b1b" stroke-width="1.8"/>
    <ellipse cx="320" cy="160" rx="10" ry="8" fill="#fee2e2" stroke="#7f1d1d"/>
    <ellipse cx="350" cy="160" rx="10" ry="8" fill="#fee2e2" stroke="#7f1d1d"/>
    <circle cx="320" cy="160" r="3" fill="#7f1d1d"/>
    <circle cx="350" cy="160" r="3" fill="#7f1d1d"/>
    <!-- CD15 Golgi dot + membrane -->
    <g>
      <g transform="translate(300 140)">
        <circle r="2.5" fill="#16a34a"/><circle cx="4" cy="-3" r="2.5" fill="#fbbf24"/><circle cx="4" cy="3" r="2.5" fill="#2563eb"/>
      </g>
      <g transform="translate(370 140)">
        <circle r="2.5" fill="#16a34a"/><circle cx="4" cy="-3" r="2.5" fill="#fbbf24"/><circle cx="4" cy="3" r="2.5" fill="#2563eb"/>
      </g>
      <circle cx="335" cy="175" r="4" fill="#16a34a" stroke="#14532d"/>
      <text x="335" y="190" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle" fill="#14532d">Golgi</text>
    </g>
    <text x="335" y="220" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#7f1d1d" font-weight="700">cHL R-S 细胞</text>
  </g>

  <text x="16" y="248" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    cHL R-S 细胞膜 + 核旁 Golgi 点状着色；与 CD30 并用确诊；腺癌也可阳性
  </text>
</svg>
