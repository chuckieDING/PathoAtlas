<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="Chromogranin A mechanism: LDCV matrix protein">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">Chromogranin A (CgA) · 大致密核心颗粒基质</text>

  <!-- Neuroendocrine cell outline -->
  <ellipse cx="210" cy="150" rx="170" ry="90" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <ellipse cx="105" cy="150" rx="20" ry="16" fill="#fde68a" stroke="#78350f" stroke-width="1.3"/>
  <text x="105" y="154" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#78350f" font-weight="700">核</text>

  <!-- Large dense-core vesicles with CgA matrix prominently -->
  <g>
    <!-- LDCV 1 - zoomed in -->
    <g transform="translate(240 110)">
      <circle r="28" fill="#fff" stroke="#b45309" stroke-width="2"/>
      <circle r="20" fill="#fbbf24" stroke="#92400e" stroke-width="1.3"/>
      <!-- CgA aggregate in matrix -->
      <g fill="#78350f">
        <circle cx="-8" cy="-6" r="2.5"/>
        <circle cx="6" cy="-3" r="2.5"/>
        <circle cx="-4" cy="4" r="2.5"/>
        <circle cx="8" cy="6" r="2.5"/>
        <circle cx="-10" cy="2" r="2.5"/>
        <circle cx="2" cy="8" r="2.5"/>
      </g>
      <text y="42" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#7c2d12" font-weight="700">LDCV</text>
    </g>

    <!-- Additional granules -->
    <g fill="#fbbf24" stroke="#92400e" stroke-width="1.3">
      <circle cx="170" cy="110" r="10"/>
      <circle cx="305" cy="100" r="9"/>
      <circle cx="160" cy="180" r="10"/>
      <circle cx="250" cy="195" r="10"/>
      <circle cx="330" cy="170" r="9"/>
      <circle cx="195" cy="130" r="9"/>
      <circle cx="195" cy="190" r="9"/>
    </g>
    <!-- CgA matrix dots in each -->
    <g fill="#78350f">
      <circle cx="170" cy="110" r="3"/>
      <circle cx="305" cy="100" r="3"/>
      <circle cx="160" cy="180" r="3"/>
      <circle cx="250" cy="195" r="3"/>
      <circle cx="330" cy="170" r="3"/>
      <circle cx="195" cy="130" r="3"/>
      <circle cx="195" cy="190" r="3"/>
    </g>
  </g>

  <!-- Arrow from CgA dot to label -->
  <g transform="translate(295 65)">
    <rect width="110" height="36" rx="5" fill="#fff" stroke="#b45309" stroke-width="1.3"/>
    <text x="55" y="14" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#7c2d12" font-weight="700">Chromogranin A</text>
    <text x="55" y="28" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#92400e">酸性糖蛋白基质</text>
  </g>
  <path d="M255 97 L300 85" stroke="#b45309" stroke-width="1.2" fill="none" stroke-dasharray="3 2"/>

  <text x="16" y="248" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    胞浆粗颗粒状 · 特异性优于 Syn · 颗粒稀少的小细胞肺癌/低分化 NET 可假阴性
  </text>
</svg>
