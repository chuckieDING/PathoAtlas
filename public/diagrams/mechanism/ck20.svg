<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="CK20 mechanism: intestinal and Merkel cell staining">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">CK20 · 肠/尿路上皮 + Merkel 细胞</text>

  <!-- Left: intestinal columnar cells with brush border -->
  <g>
    <text x="90" y="50" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#15803d" font-weight="700">肠上皮</text>

    <!-- Lumen line top -->
    <line x1="20" y1="60" x2="160" y2="60" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="90" y="72" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#0f766e">肠腔</text>

    <!-- Brush border (microvilli) -->
    <g stroke="#16a34a" stroke-width="1.2">
      <line x1="30" y1="80" x2="30" y2="90"/>
      <line x1="40" y1="80" x2="40" y2="90"/>
      <line x1="50" y1="80" x2="50" y2="90"/>
      <line x1="60" y1="80" x2="60" y2="90"/>
      <line x1="70" y1="80" x2="70" y2="90"/>
      <line x1="80" y1="80" x2="80" y2="90"/>
      <line x1="90" y1="80" x2="90" y2="90"/>
      <line x1="100" y1="80" x2="100" y2="90"/>
      <line x1="110" y1="80" x2="110" y2="90"/>
      <line x1="120" y1="80" x2="120" y2="90"/>
      <line x1="130" y1="80" x2="130" y2="90"/>
      <line x1="140" y1="80" x2="140" y2="90"/>
      <line x1="150" y1="80" x2="150" y2="90"/>
    </g>

    <!-- columnar cells -->
    <g fill="#dcfce7" stroke="#15803d" stroke-width="1.3">
      <rect x="25" y="90" width="25" height="100" rx="2"/>
      <rect x="50" y="90" width="25" height="100" rx="2"/>
      <rect x="75" y="90" width="25" height="100" rx="2"/>
      <rect x="100" y="90" width="25" height="100" rx="2"/>
      <rect x="125" y="90" width="25" height="100" rx="2"/>
    </g>
    <!-- CK20 filaments inside cells -->
    <g stroke="#dc2626" stroke-width="1.2" fill="none">
      <path d="M37 95 L37 180"/>
      <path d="M62 95 L62 180"/>
      <path d="M87 95 L87 180"/>
      <path d="M112 95 L112 180"/>
      <path d="M137 95 L137 180"/>
    </g>
    <!-- Basal nuclei -->
    <g fill="#14532d">
      <ellipse cx="37" cy="175" rx="5" ry="7"/>
      <ellipse cx="62" cy="175" rx="5" ry="7"/>
      <ellipse cx="87" cy="175" rx="5" ry="7"/>
      <ellipse cx="112" cy="175" rx="5" ry="7"/>
      <ellipse cx="137" cy="175" rx="5" ry="7"/>
    </g>
  </g>

  <!-- Right: Merkel cell with paranuclear dot -->
  <g>
    <text x="315" y="50" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#7c3aed" font-weight="700">Merkel 细胞癌</text>
    <circle cx="315" cy="140" r="60" fill="#ede9fe" stroke="#6b21a8" stroke-width="2"/>
    <ellipse cx="315" cy="140" rx="24" ry="22" fill="#c4b5fd" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="315" y="144" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#fff" font-weight="700">核</text>
    <!-- paranuclear dot -->
    <circle cx="338" cy="142" r="6" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.3"/>
    <text x="360" y="146" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d" font-weight="700">核旁点</text>
    <text x="360" y="158" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">(CK20⁺)</text>
  </g>

  <text x="16" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    CK20 阳性：肠腺癌、尿路上皮癌、胆管细胞癌、Merkel 细胞癌呈特征性核旁点状
  </text>
</svg>
