<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="SMA/Desmin mechanism: smooth muscle filaments">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">SMA / Desmin · 平滑肌/肌源性标记</text>

  <!-- Smooth muscle cell (elongated spindle) -->
  <g>
    <path d="M30 130 Q210 50 390 130 Q210 210 30 130 Z" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
    <!-- Nucleus -->
    <ellipse cx="210" cy="130" rx="22" ry="12" fill="#7f1d1d"/>
    <text x="210" y="134" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#fff" font-weight="700">核</text>
  </g>

  <!-- Actin-myosin filaments along cytoplasm (SMA = α-smooth muscle actin) -->
  <g stroke="#dc2626" stroke-width="1.5" fill="none">
    <path d="M60 120 Q210 80 360 120"/>
    <path d="M60 135 Q210 90 360 135"/>
    <path d="M60 150 Q210 100 360 150"/>
    <path d="M60 165 Q210 110 360 165"/>
  </g>
  <!-- Desmin intermediate filaments (beaded lines) -->
  <g stroke="#b45309" stroke-width="1.2" fill="none" stroke-dasharray="2 3">
    <path d="M70 110 Q210 70 350 110"/>
    <path d="M70 175 Q210 130 350 175"/>
  </g>

  <!-- Label for SMA -->
  <g transform="translate(55 70)">
    <rect width="100" height="20" rx="5" fill="#fff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="50" y="14" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#7f1d1d" font-weight="700">SMA · 胞浆微丝</text>
  </g>
  <!-- Label for desmin -->
  <g transform="translate(265 70)">
    <rect width="100" height="20" rx="5" fill="#fff" stroke="#b45309" stroke-width="1.3"/>
    <text x="50" y="14" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#7c2d12" font-weight="700">Desmin · 中间丝</text>
  </g>

  <!-- Staining type legend -->
  <g font-family="system-ui, sans-serif" font-size="9" fill="#7c2d12">
    <text x="16" y="235" font-weight="600">SMA: 平滑肌 & 肌上皮 & 肌纤维母细胞 胞浆阳性</text>
    <text x="16" y="250">Desmin: 平滑肌/骨骼肌/心肌 (肌源性分化); 肌上皮常阴性</text>
  </g>
</svg>
