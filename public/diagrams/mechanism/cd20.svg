<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="CD20 mechanism: B-cell four-pass transmembrane and rituximab target">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">CD20 (MS4A1) · B 系 4 次跨膜 · Rituximab 靶点</text>

  <!-- Membrane -->
  <rect x="0" y="110" width="420" height="24" fill="#fcd34d"/>
  <text x="20" y="102" font-family="system-ui, sans-serif" font-size="9" fill="#1e40af">细胞外</text>
  <text x="20" y="150" font-family="system-ui, sans-serif" font-size="9" fill="#9a3412">胞内</text>

  <!-- CD20 four-pass topology -->
  <g stroke="#b45309" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- 4 TM helices -->
    <path d="M150 108 L150 136"/>
    <path d="M170 108 L170 136"/>
    <path d="M190 108 L190 136"/>
    <path d="M210 108 L210 136"/>
    <!-- Extracellular loops -->
    <path d="M150 108 Q160 92 170 108"/>
    <path d="M190 108 Q200 80 210 108"/>
    <!-- Intracellular loops -->
    <path d="M170 136 Q180 148 190 136"/>
    <!-- Intracellular tails -->
    <path d="M150 136 L148 160"/>
    <path d="M210 136 L212 160"/>
  </g>
  <text x="180" y="65" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#b45309" font-weight="700">CD20 (MS4A1)</text>
  <text x="180" y="78" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#92400e">4 次跨膜</text>

  <!-- Rituximab antibody binding extracellular loop -->
  <g transform="translate(255 55)">
    <path d="M0 0 L10 25 L20 0" stroke="#047857" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M10 25 L10 50" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/>
    <text x="10" y="68" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#065f46" font-weight="700">Rituximab</text>
  </g>
  <path d="M255 80 L210 92" stroke="#047857" stroke-width="1.3" fill="none" stroke-dasharray="3 2"/>

  <!-- ADCC/CDC effector -->
  <g>
    <text x="340" y="140" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#7f1d1d" font-weight="700">ADCC / CDC</text>
    <text x="340" y="154" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#991b1b">NK / 补体 → B 溶解</text>
  </g>

  <!-- B cell reminder left -->
  <g>
    <circle cx="60" cy="180" r="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="60" y="184" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#78350f" font-weight="700">B cell</text>
  </g>

  <text x="16" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    CD20 从前 B (pre-B 后期) 至成熟 B 表达，浆细胞关闭；DLBCL/FL/CLL 阳性；浆细胞瘤阴性
  </text>
</svg>
