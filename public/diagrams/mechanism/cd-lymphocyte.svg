<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="CD markers on lymphocyte surface">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">CD 标记 · 淋巴细胞系别鉴定</text>

  <!-- T cell -->
  <g>
    <circle cx="120" cy="150" r="60" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <circle cx="120" cy="150" r="24" fill="#bae6fd" stroke="#0c4a6e" stroke-width="1.5"/>
    <text x="120" y="154" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#0c4a6e" font-weight="700">T cell</text>

    <!-- Surface receptors -->
    <g fill="#0284c7" stroke="#075985">
      <!-- CD3 (TCR complex) -->
      <rect x="72" y="110" width="8" height="14" rx="1"/>
      <text x="63" y="108" font-family="system-ui, sans-serif" font-size="8" fill="#075985" font-weight="700">CD3</text>
      <!-- CD5 -->
      <rect x="105" y="84" width="8" height="14" rx="1"/>
      <text x="93" y="82" font-family="system-ui, sans-serif" font-size="8" fill="#075985" font-weight="700">CD5</text>
      <!-- CD4 / CD8 -->
      <rect x="140" y="90" width="8" height="14" rx="1" fill="#22c55e" stroke="#15803d"/>
      <text x="149" y="99" font-family="system-ui, sans-serif" font-size="8" fill="#15803d" font-weight="700">CD4</text>
      <rect x="170" y="120" width="8" height="14" rx="1" fill="#f97316" stroke="#9a3412"/>
      <text x="182" y="130" font-family="system-ui, sans-serif" font-size="8" fill="#9a3412" font-weight="700">CD8</text>
    </g>
  </g>

  <!-- B cell -->
  <g>
    <circle cx="300" cy="150" r="60" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <circle cx="300" cy="150" r="24" fill="#fde68a" stroke="#78350f" stroke-width="1.5"/>
    <text x="300" y="154" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#78350f" font-weight="700">B cell</text>

    <g fill="#d97706" stroke="#92400e">
      <!-- CD20 -->
      <rect x="253" y="110" width="8" height="14" rx="1"/>
      <text x="245" y="108" font-family="system-ui, sans-serif" font-size="8" fill="#92400e" font-weight="700">CD20</text>
      <!-- CD79a -->
      <rect x="285" y="85" width="8" height="14" rx="1"/>
      <text x="275" y="82" font-family="system-ui, sans-serif" font-size="8" fill="#92400e" font-weight="700">CD79a</text>
      <!-- CD19 -->
      <rect x="320" y="90" width="8" height="14" rx="1"/>
      <text x="332" y="99" font-family="system-ui, sans-serif" font-size="8" fill="#92400e" font-weight="700">CD19</text>
      <!-- sIg BCR Y-shape -->
      <g transform="translate(345 115)" fill="#fff" stroke="#92400e" stroke-width="1.4">
        <path d="M0 15 L5 5 L10 15" fill="none"/>
        <path d="M5 5 L5 -5" fill="none"/>
      </g>
      <text x="355" y="112" font-family="system-ui, sans-serif" font-size="8" fill="#92400e" font-weight="700">sIg</text>
    </g>
  </g>

  <!-- Arrow separator legend -->
  <g font-family="system-ui, sans-serif" font-size="9" fill="#7c2d12">
    <text x="120" y="235" text-anchor="middle" font-weight="600">T 系：CD3⁺ CD5⁺ (pan-T) · CD4/CD8 亚群</text>
    <text x="300" y="235" text-anchor="middle" font-weight="600">B 系：CD20⁺ CD79a⁺ CD19⁺</text>
  </g>
  <text x="210" y="253" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#92400e">
    淋巴瘤分型以 CD 谱系+CD10/BCL6/Ki-67 分层  ·  Hodgkin: CD15/CD30⁺
  </text>
</svg>
