<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="Melan-A / MART-1 mechanism: melanosome membrane protein">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">Melan-A (MART-1) · 黑素体膜蛋白</text>

  <!-- Melanocyte with melanosomes -->
  <ellipse cx="210" cy="150" rx="160" ry="80" fill="#fef3c7" stroke="#78350f" stroke-width="1.8"/>
  <ellipse cx="120" cy="150" rx="22" ry="18" fill="#fde68a" stroke="#78350f" stroke-width="1.4"/>
  <text x="120" y="154" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#78350f" font-weight="700">核</text>

  <!-- Melanosomes (multiple stages, showing abundance) -->
  <g>
    <!-- Stage II-III melanosomes with membrane + inner matrix -->
    <g fill="#78350f" stroke="#451a03" stroke-width="1.2">
      <ellipse cx="170" cy="110" rx="9" ry="6"/>
      <ellipse cx="200" cy="125" rx="9" ry="6"/>
      <ellipse cx="230" cy="115" rx="9" ry="6"/>
      <ellipse cx="260" cy="130" rx="9" ry="6"/>
      <ellipse cx="195" cy="150" rx="9" ry="6"/>
      <ellipse cx="225" cy="160" rx="9" ry="6"/>
      <ellipse cx="255" cy="155" rx="9" ry="6"/>
      <ellipse cx="285" cy="145" rx="9" ry="6"/>
      <ellipse cx="180" cy="180" rx="9" ry="6"/>
      <ellipse cx="210" cy="190" rx="9" ry="6"/>
      <ellipse cx="240" cy="185" rx="9" ry="6"/>
      <ellipse cx="270" cy="180" rx="9" ry="6"/>
      <ellipse cx="300" cy="170" rx="9" ry="6"/>
      <ellipse cx="320" cy="150" rx="9" ry="6"/>
    </g>
    <!-- Red ring on each highlighting membrane -->
    <g fill="none" stroke="#dc2626" stroke-width="1.5">
      <ellipse cx="170" cy="110" rx="10" ry="7"/>
      <ellipse cx="200" cy="125" rx="10" ry="7"/>
      <ellipse cx="230" cy="115" rx="10" ry="7"/>
      <ellipse cx="260" cy="130" rx="10" ry="7"/>
      <ellipse cx="195" cy="150" rx="10" ry="7"/>
      <ellipse cx="225" cy="160" rx="10" ry="7"/>
      <ellipse cx="255" cy="155" rx="10" ry="7"/>
      <ellipse cx="285" cy="145" rx="10" ry="7"/>
      <ellipse cx="180" cy="180" rx="10" ry="7"/>
      <ellipse cx="210" cy="190" rx="10" ry="7"/>
      <ellipse cx="240" cy="185" rx="10" ry="7"/>
      <ellipse cx="270" cy="180" rx="10" ry="7"/>
      <ellipse cx="300" cy="170" rx="10" ry="7"/>
      <ellipse cx="320" cy="150" rx="10" ry="7"/>
    </g>
  </g>

  <!-- Zoomed insert showing MART-1 on membrane -->
  <g transform="translate(340 78)">
    <circle r="28" fill="#fff" stroke="#dc2626" stroke-width="1.8"/>
    <ellipse rx="16" ry="10" fill="#78350f"/>
    <g stroke="#dc2626" stroke-width="2">
      <line x1="-16" y1="-2" x2="-22" y2="-4"/>
      <line x1="0" y1="-10" x2="0" y2="-18"/>
      <line x1="16" y1="-2" x2="22" y2="-4"/>
      <line x1="12" y1="8" x2="18" y2="14"/>
      <line x1="-12" y1="8" x2="-18" y2="14"/>
    </g>
    <text y="-34" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#7f1d1d" font-weight="700">MART-1</text>
  </g>

  <text x="16" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    胞浆颗粒状着色 · 与 HMB-45 互补 · 痣细胞/黑素瘤敏感性更高 (>90%)
  </text>
</svg>
