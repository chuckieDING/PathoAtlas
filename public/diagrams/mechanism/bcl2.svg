<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="BCL2 mechanism: anti-apoptotic outer mitochondrial membrane protein">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">BCL2 · 线粒体外膜抗凋亡蛋白</text>

  <!-- Mitochondrion -->
  <g transform="translate(210 145)">
    <ellipse rx="140" ry="70" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
    <!-- Inner membrane cristae -->
    <g stroke="#7f1d1d" stroke-width="1.5" fill="none">
      <path d="M-120 0 Q-110 -30 -95 0 Q-80 30 -65 0 Q-50 -30 -35 0 Q-20 30 -5 0 Q10 -30 25 0 Q40 30 55 0 Q70 -30 85 0 Q100 30 115 0"/>
    </g>
  </g>
  <text x="210" y="78" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#7f1d1d" font-weight="700">线粒体</text>

  <!-- BCL2 anchored in outer membrane (top) -->
  <g>
    <rect x="170" y="70" width="14" height="20" fill="#0ea5e9" stroke="#075985" stroke-width="1.3" rx="3"/>
    <text x="200" y="80" font-family="system-ui, sans-serif" font-size="9" fill="#075985" font-weight="700">BCL2</text>
    <rect x="240" y="70" width="14" height="20" fill="#0ea5e9" stroke="#075985" stroke-width="1.3" rx="3"/>
    <!-- Another BCL2 -->
    <rect x="110" y="130" width="20" height="14" fill="#0ea5e9" stroke="#075985" stroke-width="1.3" rx="3"/>
    <rect x="290" y="130" width="20" height="14" fill="#0ea5e9" stroke="#075985" stroke-width="1.3" rx="3"/>
  </g>

  <!-- BAX / BAK being blocked -->
  <g>
    <rect x="200" y="100" width="14" height="20" fill="#fbbf24" stroke="#78350f" stroke-width="1.3" rx="3"/>
    <text x="207" y="115" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle" fill="#78350f" font-weight="700">BAX</text>
    <!-- Inhibition bar -->
    <line x1="184" y1="88" x2="200" y2="110" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="200" cy="110" r="3" fill="#dc2626"/>
  </g>

  <!-- Cytochrome C retained -->
  <g>
    <circle cx="210" cy="160" r="6" fill="#ea580c" stroke="#7c2d12"/>
    <text x="210" y="163" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle" fill="#fff" font-weight="700">Cyt-C</text>
    <circle cx="170" cy="175" r="5" fill="#ea580c" stroke="#7c2d12"/>
    <circle cx="250" cy="175" r="5" fill="#ea580c" stroke="#7c2d12"/>
    <text x="330" y="163" font-family="system-ui, sans-serif" font-size="8" fill="#7c2d12" font-weight="700">保留 Cyt-C</text>
    <text x="330" y="175" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">→ 抑制 caspase</text>
  </g>

  <!-- Anti-apoptosis arrow -->
  <g>
    <text x="60" y="120" font-family="system-ui, sans-serif" font-size="9" fill="#065f46" font-weight="700">抑制凋亡</text>
    <path d="M60 125 L60 160" stroke="#dc2626" stroke-width="3"/>
    <line x1="50" y1="155" x2="70" y2="155" stroke="#dc2626" stroke-width="3"/>
    <text x="60" y="175" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#7f1d1d">apoptosis</text>
  </g>

  <text x="16" y="245" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    FL (t14;18 BCL2-IGH) &gt;90% 阳性 · CLL/MCL 阳性 · 反应性 GC 阴性 (特征性)
  </text>
</svg>
