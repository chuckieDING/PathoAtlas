<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="CD10 mechanism: CALLA/neprilysin metalloendopeptidase">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">CD10 (CALLA / Neprilysin) · 膜金属内肽酶</text>

  <!-- Lymph node with germinal center -->
  <g>
    <circle cx="130" cy="145" r="85" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="130" cy="135" r="45" fill="#fff7ed" stroke="#b45309" stroke-width="1.3"/>
    <text x="130" y="90" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#92400e" font-weight="700">淋巴滤泡</text>
    <text x="130" y="138" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#b45309" font-weight="600">GC</text>
    <text x="130" y="150" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#78350f">(CD10⁺)</text>
    <!-- scattered centroblasts/centrocytes -->
    <g fill="#dc2626">
      <circle cx="110" cy="120" r="3"/>
      <circle cx="130" cy="115" r="3"/>
      <circle cx="150" cy="125" r="3"/>
      <circle cx="115" cy="145" r="3"/>
      <circle cx="145" cy="140" r="3"/>
      <circle cx="125" cy="160" r="3"/>
    </g>
    <!-- Mantle zone - CD10 negative -->
    <g fill="#78350f">
      <circle cx="85" cy="100" r="2"/>
      <circle cx="175" cy="105" r="2"/>
      <circle cx="60" cy="160" r="2"/>
      <circle cx="195" cy="160" r="2"/>
      <circle cx="90" cy="200" r="2"/>
      <circle cx="170" cy="200" r="2"/>
    </g>
  </g>

  <!-- Right: enzymatic mechanism of neprilysin cleaving peptides -->
  <g transform="translate(250 70)">
    <text x="70" y="0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#0284c7" font-weight="700">中性内肽酶活性</text>

    <!-- Cell membrane segment -->
    <rect x="0" y="55" width="150" height="12" fill="#fcd34d"/>
    <!-- CD10 anchored -->
    <rect x="65" y="35" width="20" height="25" fill="#0ea5e9" stroke="#075985" rx="3"/>
    <text x="75" y="50" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#fff" font-weight="700">CD10</text>

    <!-- Peptide coming in (bradykinin / substance P / ENK) -->
    <g fill="#ec4899" stroke="#831843">
      <circle cx="15" cy="22" r="4"/>
      <circle cx="25" cy="22" r="4"/>
      <circle cx="35" cy="22" r="4"/>
      <circle cx="45" cy="22" r="4"/>
    </g>
    <text x="30" y="14" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#831843">底物肽</text>
    <path d="M50 22 L65 32" stroke="#831843" stroke-width="1.3" fill="none" marker-end="url(#cd10-arr)"/>
    <defs>
      <marker id="cd10-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#831843"/>
      </marker>
    </defs>

    <!-- Fragments emerging -->
    <g fill="#ec4899" stroke="#831843">
      <circle cx="100" cy="22" r="4"/>
      <circle cx="110" cy="22" r="4"/>
    </g>
    <g fill="#ec4899" stroke="#831843">
      <circle cx="130" cy="22" r="4"/>
      <circle cx="140" cy="22" r="4"/>
    </g>
    <path d="M85 32 L100 22" stroke="#831843" stroke-width="1.3" fill="none" marker-end="url(#cd10-arr)"/>
    <path d="M85 32 L130 22" stroke="#831843" stroke-width="1.3" fill="none" marker-end="url(#cd10-arr)"/>
    <text x="120" y="14" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#831843">降解产物</text>
  </g>

  <text x="16" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    germinal center B 细胞 (FL/BL/DLBCL-GCB) + 前 B 急性白血病 (CALLA) + 肾近曲小管/子宫间质
  </text>
</svg>
