<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="CK7 mechanism in glandular epithelium">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">CK7 · 腺上皮/导管角蛋白</text>

  <!-- Glandular lumen (donut) -->
  <circle cx="210" cy="150" r="90" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="210" cy="150" r="35" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="210" y="154" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#92400e">腺腔</text>

  <!-- Columnar cells radiating around lumen -->
  <g>
    <!-- 8 cells around circle -->
    <g fill="#fde68a" stroke="#a16207" stroke-width="1.2">
      <ellipse cx="210" cy="82" rx="12" ry="22"/>
      <ellipse cx="258" cy="102" rx="22" ry="12" transform="rotate(45 258 102)"/>
      <ellipse cx="278" cy="150" rx="22" ry="12"/>
      <ellipse cx="258" cy="198" rx="22" ry="12" transform="rotate(-45 258 198)"/>
      <ellipse cx="210" cy="218" rx="12" ry="22"/>
      <ellipse cx="162" cy="198" rx="22" ry="12" transform="rotate(45 162 198)"/>
      <ellipse cx="142" cy="150" rx="22" ry="12"/>
      <ellipse cx="162" cy="102" rx="22" ry="12" transform="rotate(-45 162 102)"/>
    </g>
    <!-- Nuclei basal (far from lumen) -->
    <g fill="#78350f">
      <circle cx="210" cy="72" r="3"/>
      <circle cx="263" cy="97" r="3"/>
      <circle cx="288" cy="150" r="3"/>
      <circle cx="263" cy="203" r="3"/>
      <circle cx="210" cy="228" r="3"/>
      <circle cx="157" cy="203" r="3"/>
      <circle cx="132" cy="150" r="3"/>
      <circle cx="157" cy="97" r="3"/>
    </g>
    <!-- CK7 filaments (dense red stippled stroke inside each cell) -->
    <g stroke="#dc2626" stroke-width="1.2" fill="none">
      <path d="M210 92 L210 180"/>
      <path d="M252 108 L175 185"/>
      <path d="M268 150 L152 150"/>
      <path d="M252 192 L175 115"/>
    </g>
  </g>

  <!-- Label -->
  <g transform="translate(320 58)">
    <rect width="90" height="22" rx="5" fill="#fff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="45" y="15" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#7f1d1d" font-weight="700">CK7 胞浆阳性</text>
  </g>

  <text x="16" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    乳腺/肺/子宫/胆管/胰腺导管 + 尿路上皮 · 胃肠腺癌多为阴性 (除外食管/胃贲门)
  </text>
</svg>
