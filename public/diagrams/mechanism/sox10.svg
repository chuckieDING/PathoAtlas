<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="SOX10 mechanism: nuclear transcription factor in neural crest lineage">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">SOX10 · 神经嵴核转录因子 (HMG-box)</text>

  <!-- Melanoma cell outline -->
  <ellipse cx="210" cy="150" rx="160" ry="80" fill="#fef3c7" stroke="#78350f" stroke-width="1.8"/>
  <!-- Nucleus large, central -->
  <ellipse cx="210" cy="150" rx="70" ry="50" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.8"/>

  <!-- Densely packed SOX10 dots in nucleus (nuclear-only positivity) -->
  <g fill="#7c3aed">
    <circle cx="175" cy="125" r="2.5"/>
    <circle cx="190" cy="130" r="2.5"/>
    <circle cx="205" cy="122" r="2.5"/>
    <circle cx="220" cy="128" r="2.5"/>
    <circle cx="238" cy="130" r="2.5"/>
    <circle cx="180" cy="140" r="2.5"/>
    <circle cx="200" cy="143" r="2.5"/>
    <circle cx="215" cy="145" r="2.5"/>
    <circle cx="232" cy="142" r="2.5"/>
    <circle cx="170" cy="158" r="2.5"/>
    <circle cx="190" cy="160" r="2.5"/>
    <circle cx="210" cy="158" r="2.5"/>
    <circle cx="228" cy="160" r="2.5"/>
    <circle cx="246" cy="158" r="2.5"/>
    <circle cx="178" cy="175" r="2.5"/>
    <circle cx="198" cy="177" r="2.5"/>
    <circle cx="218" cy="175" r="2.5"/>
    <circle cx="238" cy="177" r="2.5"/>
  </g>

  <!-- DNA bound (HMG-box) -->
  <g stroke="#0f766e" stroke-width="1.5" fill="none">
    <path d="M150 190 Q200 185 250 190 Q290 195 270 200"/>
    <path d="M150 195 Q200 190 250 195 Q290 200 270 205"/>
  </g>
  <text x="210" y="220" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#0f766e" font-weight="600">结合 DNA 调控 MITF / 色素基因</text>

  <!-- Legend of covered lineages -->
  <g font-family="system-ui, sans-serif" font-size="8" fill="#7c2d12">
    <text x="30" y="58">• 黑色素细胞</text>
    <text x="30" y="72">• 神经鞘 (施万细胞)</text>
    <text x="305" y="58">• 乳腺肌上皮</text>
    <text x="305" y="72">• 神经鞘瘤</text>
  </g>

  <!-- Label box -->
  <g transform="translate(150 80)">
    <rect width="120" height="22" rx="5" fill="#fff" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="60" y="15" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#5b21b6" font-weight="700">核着色 (胞浆阴性)</text>
  </g>

  <text x="16" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    较 S-100 更特异；去分化黑色素瘤 / 透明细胞肉瘤首选；乳腺肌上皮也阳性
  </text>
</svg>
