<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Cytokeratin mechanism: epithelial intermediate filaments">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">CK · 上皮细胞角蛋白骨架</text>

  <!-- Epithelial cell outline -->
  <path d="M40 60 Q210 40 380 60 L380 220 Q210 240 40 220 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <!-- Nucleus -->
  <ellipse cx="210" cy="140" rx="32" ry="24" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
  <text x="210" y="144" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#78350f" font-weight="700">核</text>

  <!-- Intermediate filaments radiating -->
  <g stroke="#dc2626" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M75 80 Q140 110 180 130"/>
    <path d="M105 70 Q160 100 190 125"/>
    <path d="M145 62 Q180 100 200 125"/>
    <path d="M210 58 L210 110"/>
    <path d="M280 62 Q240 100 225 125"/>
    <path d="M320 70 Q260 100 235 128"/>
    <path d="M350 80 Q280 110 240 130"/>
    <path d="M60 160 Q130 155 180 150"/>
    <path d="M70 200 Q140 180 185 160"/>
    <path d="M130 220 Q165 200 195 165"/>
    <path d="M210 225 L210 168"/>
    <path d="M280 220 Q240 200 225 168"/>
    <path d="M335 200 Q270 180 240 160"/>
    <path d="M360 160 Q290 155 240 150"/>
  </g>

  <!-- CK pair label (CK8/18 acidic+basic example) -->
  <g transform="translate(75 95)">
    <path d="M0 0 L40 8" stroke="#dc2626" stroke-width="2.2"/>
    <path d="M0 4 L40 12" stroke="#b91c1c" stroke-width="2.2"/>
    <text x="45" y="5" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d" font-weight="700">酸性 CK + 碱性 CK</text>
    <text x="45" y="16" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">(异型二聚体)</text>
  </g>

  <!-- Desmosome anchoring -->
  <g>
    <rect x="15" y="115" width="30" height="18" fill="#60a5fa" stroke="#1e40af" stroke-width="1.2" rx="2"/>
    <text x="30" y="127" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#fff" font-weight="700">桥粒</text>
    <rect x="375" y="115" width="30" height="18" fill="#60a5fa" stroke="#1e40af" stroke-width="1.2" rx="2"/>
    <text x="390" y="127" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#fff" font-weight="700">桥粒</text>
  </g>

  <!-- Legend dots -->
  <g font-family="system-ui, sans-serif" font-size="9" fill="#78350f">
    <text x="16" y="250">CK7 · 腺上皮(乳腺/肺/子宫)  ·  CK20 · 肠/尿路  ·  CK5/6 · 鳞状/基底  ·  CK19 · 胆管/甲状腺</text>
  </g>
</svg>
