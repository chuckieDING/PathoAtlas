<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="Progesterone receptor mechanism">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">PR · 孕激素受体 (ER 下游靶基因)</text>

  <!-- Cell with nucleus -->
  <rect x="20" y="40" width="380" height="200" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <ellipse cx="240" cy="150" rx="120" ry="75" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>

  <!-- ER dimer first -->
  <g transform="translate(120 145)">
    <rect width="44" height="14" rx="4" fill="#a78bfa" stroke="#5b21b6"/>
    <text x="22" y="11" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#fff" font-weight="700">ER dimer</text>
  </g>
  <path d="M140 142 L140 118" stroke="#7c3aed" stroke-width="1.3" fill="none" stroke-dasharray="3 2" marker-end="url(#pr-arr)"/>
  <defs>
    <marker id="pr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <text x="175" y="128" font-family="system-ui, sans-serif" font-size="8" fill="#5b21b6">诱导 PGR 转录</text>

  <!-- PGR gene arrow -->
  <g stroke="#0f766e" stroke-width="1.6" fill="none">
    <path d="M200 108 Q235 102 270 108"/>
    <path d="M200 112 Q235 106 270 112"/>
  </g>
  <text x="235" y="100" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#0f766e" font-weight="600">PGR 基因</text>

  <!-- PR isoforms emerge -->
  <g transform="translate(285 135)">
    <rect width="60" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <text x="30" y="13" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#7c2d12" font-weight="700">PR-A</text>
  </g>
  <g transform="translate(285 165)">
    <rect width="80" height="18" rx="4" fill="#f59e0b" stroke="#b45309"/>
    <text x="40" y="13" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#7c2d12" font-weight="700">PR-B (完整)</text>
  </g>

  <!-- Progesterone ligand -->
  <g transform="translate(50 95)">
    <circle r="8" fill="#f472b6" stroke="#831843" stroke-width="1.2"/>
    <text y="3" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#fff" font-weight="700">P4</text>
  </g>
  <text x="50" y="122" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#831843">孕酮</text>
  <path d="M60 98 Q130 180 200 200" stroke="#831843" stroke-width="1.2" fill="none" stroke-dasharray="3 2"/>

  <text x="16" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    PR 是 ER 通路下游产物 (PR 阳性 = ER 通路功能正常)；PR-A/PR-B 异构体均可与孕酮结合
  </text>
</svg>
