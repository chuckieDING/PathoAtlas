<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="ER mechanism: ligand-activated nuclear receptor">
  <defs>
    <linearGradient id="er-cyto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="er-nuc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </radialGradient>
  </defs>
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">ER · 雌激素受体作用机制</text>

  <!-- Cell boundary -->
  <rect x="20" y="40" width="380" height="200" rx="18" fill="url(#er-cyto)" stroke="#d97706" stroke-width="1.5"/>
  <!-- Nucleus -->
  <ellipse cx="290" cy="145" rx="90" ry="70" fill="url(#er-nuc)" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="290" y="90" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#5b21b6" font-weight="600">细胞核 Nucleus</text>

  <!-- Estrogen (E2) entering from outside -->
  <g>
    <circle cx="50" cy="80" r="8" fill="#ec4899" stroke="#9d174d" stroke-width="1.2"/>
    <text x="50" y="83" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#fff" font-weight="700">E2</text>
    <path d="M62 86 L115 115" stroke="#9d174d" stroke-width="1.3" stroke-dasharray="3 2" fill="none" marker-end="url(#arrow1)"/>
  </g>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9d174d"/>
    </marker>
  </defs>

  <!-- Free cytoplasmic ER monomer -->
  <g>
    <path d="M110 100 q8 -14 18 0 q-6 8 -18 0 z" fill="#a78bfa" stroke="#5b21b6" stroke-width="1.2"/>
    <text x="120" y="132" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#5b21b6">ER</text>
    <circle cx="118" cy="100" r="4" fill="#ec4899" stroke="#9d174d" stroke-width="0.8"/>
  </g>

  <!-- Translocation arrow into nucleus -->
  <path d="M135 105 Q180 110 215 130" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ER dimer bound to DNA (ERE) inside nucleus -->
  <g transform="translate(240 150)">
    <path d="M0 0 q10 -16 22 0 q-8 10 -22 0 z" fill="#a78bfa" stroke="#5b21b6" stroke-width="1.2"/>
    <path d="M20 0 q10 -16 22 0 q-8 10 -22 0 z" fill="#a78bfa" stroke="#5b21b6" stroke-width="1.2"/>
    <circle cx="10" cy="-6" r="3.5" fill="#ec4899" stroke="#9d174d" stroke-width="0.7"/>
    <circle cx="32" cy="-6" r="3.5" fill="#ec4899" stroke="#9d174d" stroke-width="0.7"/>
    <text x="21" y="20" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#5b21b6" font-weight="700">ER dimer</text>
  </g>

  <!-- DNA / ERE element -->
  <g stroke="#0f766e" stroke-width="1.6" fill="none">
    <path d="M230 175 Q260 170 290 175 Q320 180 350 175"/>
    <path d="M230 180 Q260 175 290 180 Q320 185 350 180"/>
  </g>
  <text x="290" y="200" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#0f766e" font-weight="600">ERE · 靶基因启动子</text>

  <!-- Effect label -->
  <text x="15" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">① E2 进入细胞 → ② ER 活化二聚化 → ③ 入核结合 ERE → ④ 转录细胞周期/增殖基因</text>
</svg>
