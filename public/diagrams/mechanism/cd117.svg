<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="CD117 c-KIT mechanism in GIST">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">CD117 (c-KIT) · Ⅲ型 RTK · GIST 驱动基因</text>

  <!-- Extracellular / cytoplasm backgrounds -->
  <rect x="0" y="40" width="420" height="70" fill="#e0f2fe" opacity="0.45"/>
  <text x="405" y="58" font-family="system-ui, sans-serif" font-size="9" text-anchor="end" fill="#1e40af">细胞外</text>
  <rect x="0" y="134" width="420" height="126" fill="#fff7ed" opacity="0.4"/>
  <text x="405" y="150" font-family="system-ui, sans-serif" font-size="9" text-anchor="end" fill="#9a3412">细胞质</text>
  <rect x="0" y="110" width="420" height="24" fill="#fde68a"/>

  <!-- Normal KIT receptor (monomer) -->
  <g>
    <path d="M90 60 L90 110" stroke="#6b7280" stroke-width="7" stroke-linecap="round"/>
    <circle cx="90" cy="55" r="9" fill="#9ca3af" stroke="#4b5563"/>
    <rect x="82" y="134" width="16" height="35" fill="#9ca3af" rx="3" stroke="#4b5563"/>
    <text x="90" y="175" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#374151" font-weight="600">野生型</text>
    <text x="90" y="187" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#4b5563">需配体 SCF</text>
  </g>

  <!-- SCF ligand floating -->
  <g transform="translate(70 45)">
    <circle r="6" fill="#ec4899" stroke="#831843"/>
    <text x="0" y="3" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#fff" font-weight="700">SCF</text>
  </g>

  <!-- Mutant KIT dimer auto-activated -->
  <g>
    <path d="M220 60 L220 110" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
    <path d="M250 60 L250 110" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
    <circle cx="220" cy="55" r="9" fill="#ef4444" stroke="#7f1d1d"/>
    <circle cx="250" cy="55" r="9" fill="#ef4444" stroke="#7f1d1d"/>
    <rect x="210" y="134" width="20" height="35" fill="#dc2626" rx="3"/>
    <rect x="240" y="134" width="20" height="35" fill="#dc2626" rx="3"/>
    <circle cx="205" cy="175" r="5" fill="#fbbf24" stroke="#d97706"/>
    <text x="205" y="178" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#7c2d12" font-weight="700">P</text>
    <circle cx="265" cy="175" r="5" fill="#fbbf24" stroke="#d97706"/>
    <text x="265" y="178" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#7c2d12" font-weight="700">P</text>
    <text x="235" y="200" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#7f1d1d" font-weight="700">exon 11 突变</text>
    <text x="235" y="212" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#991b1b">配体非依赖二聚体</text>
  </g>

  <!-- Inhibitor imatinib -->
  <g transform="translate(330 175)">
    <rect width="60" height="22" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <text x="30" y="15" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#14532d" font-weight="700">Imatinib</text>
    <path d="M0 10 L-50 0" stroke="#15803d" stroke-width="1.3" fill="none" stroke-dasharray="3 2"/>
  </g>

  <text x="16" y="253" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    GIST 大多为 KIT exon 9/11 获得性功能突变 → 膜阳性 CD117 + 胞浆 DOG1 阳性 → 靶向 TKI 治疗
  </text>
</svg>
