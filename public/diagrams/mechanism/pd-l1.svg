<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="PD-L1/PD-1 immune checkpoint mechanism">
  <rect width="420" height="260" fill="#fdf4ef"/>
  <text x="16" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">PD-L1 · 免疫检查点通路</text>

  <!-- Tumor cell -->
  <g>
    <path d="M30 90 Q80 60 140 80 Q150 140 120 190 Q60 200 30 160 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <text x="85" y="130" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#7f1d1d" font-weight="700">肿瘤细胞</text>
    <text x="85" y="145" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#991b1b">Tumor</text>

    <!-- PD-L1 on tumor surface -->
    <rect x="140" y="90" width="10" height="18" rx="1.5" fill="#be123c" stroke="#7f1d1d"/>
    <text x="155" y="90" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d" font-weight="700">PD-L1</text>

    <rect x="140" y="130" width="10" height="18" rx="1.5" fill="#be123c" stroke="#7f1d1d"/>
    <rect x="140" y="170" width="10" height="18" rx="1.5" fill="#be123c" stroke="#7f1d1d"/>
  </g>

  <!-- T cell -->
  <g>
    <circle cx="320" cy="140" r="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="320" y="144" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="700">T cell</text>

    <!-- PD-1 on T cell -->
    <rect x="248" y="90" width="10" height="18" rx="1.5" fill="#1d4ed8" stroke="#1e3a8a"/>
    <text x="262" y="90" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a" font-weight="700">PD-1</text>

    <rect x="248" y="130" width="10" height="18" rx="1.5" fill="#1d4ed8" stroke="#1e3a8a"/>
    <rect x="248" y="170" width="10" height="18" rx="1.5" fill="#1d4ed8" stroke="#1e3a8a"/>
  </g>

  <!-- Binding dashed lines -->
  <g stroke="#7f1d1d" stroke-width="1.6" stroke-dasharray="3 2">
    <line x1="151" y1="99" x2="247" y2="99"/>
    <line x1="151" y1="139" x2="247" y2="139"/>
    <line x1="151" y1="179" x2="247" y2="179"/>
  </g>

  <!-- Inhibition symbol -->
  <g transform="translate(200 215)">
    <circle r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#dc2626" stroke-width="2.2"/>
    <text x="0" y="30" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#7f1d1d" font-weight="700">T 细胞抑制</text>
  </g>

  <!-- Therapy block -->
  <g>
    <path d="M10 220 L30 245 L50 220" stroke="#059669" stroke-width="2" fill="none"/>
    <text x="30" y="260" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#065f46" font-weight="700">Nivolumab</text>
  </g>

  <text x="20" y="253" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">
    PD-L1 阳性百分比 (TPS/CPS) 指导 ICIs 适应；TPS ≥1% 或 ≥50% 肺癌不同线治疗阈值
  </text>
</svg>
