<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Keratin pearl in SCC">
  <rect width="400" height="240" fill="#fdf4ef"/>
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#be185d">角化珠 · Keratin pearl</text>
  <g>
    <!-- Large nest of squamous cells -->
    <ellipse cx="200" cy="130" rx="140" ry="75" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/>
    <!-- Concentric laminated keratin pearl center -->
    <g>
      <ellipse cx="200" cy="130" rx="42" ry="32" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <ellipse cx="200" cy="130" rx="30" ry="22" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
      <ellipse cx="200" cy="130" rx="18" ry="13" fill="#facc15"/>
      <ellipse cx="200" cy="130" rx="8" ry="6" fill="#ca8a04"/>
    </g>
    <!-- Peripheral nuclei -->
    <g fill="#831843">
      <circle cx="80" cy="130" r="3"/><circle cx="90" cy="100" r="3"/><circle cx="110" cy="80" r="3"/>
      <circle cx="140" cy="65" r="3"/><circle cx="170" cy="58" r="3"/><circle cx="200" cy="55" r="3"/>
      <circle cx="230" cy="58" r="3"/><circle cx="260" cy="65" r="3"/><circle cx="290" cy="80" r="3"/>
      <circle cx="310" cy="100" r="3"/><circle cx="320" cy="130" r="3"/><circle cx="310" cy="160" r="3"/>
      <circle cx="290" cy="180" r="3"/><circle cx="260" cy="195" r="3"/><circle cx="230" cy="202" r="3"/>
      <circle cx="200" cy="205" r="3"/><circle cx="170" cy="202" r="3"/><circle cx="140" cy="195" r="3"/>
      <circle cx="110" cy="180" r="3"/><circle cx="90" cy="160" r="3"/>
      <!-- Inner layer -->
      <circle cx="130" cy="115" r="3"/><circle cx="155" cy="95" r="3"/><circle cx="185" cy="85" r="3"/>
      <circle cx="215" cy="85" r="3"/><circle cx="245" cy="95" r="3"/><circle cx="270" cy="115" r="3"/>
      <circle cx="270" cy="145" r="3"/><circle cx="245" cy="165" r="3"/><circle cx="215" cy="175" r="3"/>
      <circle cx="185" cy="175" r="3"/><circle cx="155" cy="165" r="3"/><circle cx="130" cy="145" r="3"/>
    </g>
  </g>
  <text x="20" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">鳞状细胞巢中心出现的同心圆状角化物质，是鳞状细胞分化的标志</text>
</svg>
