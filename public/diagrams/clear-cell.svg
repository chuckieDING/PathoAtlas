<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-label="Clear cell pattern">
  <rect width="400" height="240" fill="#fdf4ef"/>
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0369a1">透明细胞 · Clear cells</text>
  <!-- Capillary network (classic of clear cell RCC) -->
  <g stroke="#dc2626" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M40 110 Q90 80 140 110 Q190 140 240 110 Q290 80 340 110"/>
    <path d="M40 160 Q90 130 140 160 Q190 190 240 160 Q290 130 340 160"/>
    <path d="M80 50 L80 200"/>
    <path d="M160 50 L160 200"/>
    <path d="M240 50 L240 200"/>
    <path d="M320 50 L320 200"/>
  </g>
  <!-- Clear cells arranged in nests -->
  <g>
    <g fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5">
      <rect x="50" y="60" width="30" height="30" rx="4"/>
      <rect x="90" y="60" width="30" height="30" rx="4"/>
      <rect x="130" y="60" width="30" height="30" rx="4"/>
      <rect x="170" y="60" width="30" height="30" rx="4"/>
      <rect x="210" y="60" width="30" height="30" rx="4"/>
      <rect x="250" y="60" width="30" height="30" rx="4"/>
      <rect x="290" y="60" width="30" height="30" rx="4"/>
      <rect x="330" y="60" width="30" height="30" rx="4"/>

      <rect x="50" y="115" width="30" height="30" rx="4"/>
      <rect x="90" y="115" width="30" height="30" rx="4"/>
      <rect x="130" y="115" width="30" height="30" rx="4"/>
      <rect x="170" y="115" width="30" height="30" rx="4"/>
      <rect x="210" y="115" width="30" height="30" rx="4"/>
      <rect x="250" y="115" width="30" height="30" rx="4"/>
      <rect x="290" y="115" width="30" height="30" rx="4"/>
      <rect x="330" y="115" width="30" height="30" rx="4"/>

      <rect x="50" y="170" width="30" height="30" rx="4"/>
      <rect x="90" y="170" width="30" height="30" rx="4"/>
      <rect x="130" y="170" width="30" height="30" rx="4"/>
      <rect x="170" y="170" width="30" height="30" rx="4"/>
      <rect x="210" y="170" width="30" height="30" rx="4"/>
      <rect x="250" y="170" width="30" height="30" rx="4"/>
      <rect x="290" y="170" width="30" height="30" rx="4"/>
      <rect x="330" y="170" width="30" height="30" rx="4"/>
    </g>
    <g fill="#0c4a6e">
      <circle cx="65" cy="75" r="2.5"/><circle cx="105" cy="75" r="2.5"/><circle cx="145" cy="75" r="2.5"/><circle cx="185" cy="75" r="2.5"/>
      <circle cx="225" cy="75" r="2.5"/><circle cx="265" cy="75" r="2.5"/><circle cx="305" cy="75" r="2.5"/><circle cx="345" cy="75" r="2.5"/>
      <circle cx="65" cy="130" r="2.5"/><circle cx="105" cy="130" r="2.5"/><circle cx="145" cy="130" r="2.5"/><circle cx="185" cy="130" r="2.5"/>
      <circle cx="225" cy="130" r="2.5"/><circle cx="265" cy="130" r="2.5"/><circle cx="305" cy="130" r="2.5"/><circle cx="345" cy="130" r="2.5"/>
      <circle cx="65" cy="185" r="2.5"/><circle cx="105" cy="185" r="2.5"/><circle cx="145" cy="185" r="2.5"/><circle cx="185" cy="185" r="2.5"/>
      <circle cx="225" cy="185" r="2.5"/><circle cx="265" cy="185" r="2.5"/><circle cx="305" cy="185" r="2.5"/><circle cx="345" cy="185" r="2.5"/>
    </g>
  </g>
  <text x="20" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">胞浆透明的肿瘤细胞被富含毛细血管网的纤细间隔分隔，为透明细胞 RCC 典型表现</text>
