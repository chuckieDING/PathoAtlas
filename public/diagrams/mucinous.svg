<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-label="Mucinous lake pattern">
  <rect width="400" height="240" fill="#fdf4ef"/>
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0369a1">黏液湖 · Mucinous pools</text>
  <!-- Mucin pools (pale blue) -->
  <g fill="#bae6fd" stroke="#0ea5e9" stroke-width="1">
    <ellipse cx="110" cy="130" rx="60" ry="45"/>
    <ellipse cx="260" cy="120" rx="70" ry="50"/>
    <ellipse cx="200" cy="195" rx="55" ry="28"/>
  </g>
  <!-- Floating small clusters of tumor cells -->
  <g fill="#1e40af">
    <circle cx="80" cy="115" r="3"/><circle cx="85" cy="120" r="3"/><circle cx="80" cy="125" r="3"/>
    <circle cx="115" cy="100" r="3"/><circle cx="120" cy="105" r="3"/><circle cx="115" cy="110" r="3"/><circle cx="110" cy="105" r="3"/>
    <circle cx="140" cy="135" r="3"/><circle cx="145" cy="140" r="3"/><circle cx="140" cy="145" r="3"/>
    <circle cx="95" cy="155" r="3"/><circle cx="100" cy="150" r="3"/><circle cx="100" cy="160" r="3"/>

    <circle cx="230" cy="95" r="3"/><circle cx="235" cy="100" r="3"/><circle cx="230" cy="105" r="3"/><circle cx="225" cy="100" r="3"/>
    <circle cx="280" cy="105" r="3"/><circle cx="285" cy="110" r="3"/><circle cx="280" cy="115" r="3"/>
    <circle cx="250" cy="140" r="3"/><circle cx="255" cy="145" r="3"/><circle cx="250" cy="150" r="3"/>
    <circle cx="295" cy="140" r="3"/><circle cx="300" cy="135" r="3"/>

    <circle cx="180" cy="190" r="3"/><circle cx="185" cy="195" r="3"/><circle cx="180" cy="200" r="3"/>
    <circle cx="215" cy="190" r="3"/><circle cx="220" cy="195" r="3"/>
  </g>
  <text x="20" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">大量细胞外黏液中漂浮着小簇状肿瘤细胞，纯型需 &gt; 90% 黏液成分</text>
</svg>
