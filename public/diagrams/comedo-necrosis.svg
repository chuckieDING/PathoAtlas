<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-label="Comedo necrosis in DCIS">
  <rect width="400" height="240" fill="#fdf4ef"/>
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#b91c1c">粉刺样坏死 · Comedo necrosis</text>
  <g>
    <!-- Duct outline -->
    <ellipse cx="200" cy="130" rx="140" ry="70" fill="none" stroke="#ec4899" stroke-width="3"/>
    <!-- Tumor cells lining inside -->
    <g fill="#be185d">
      <circle cx="75"  cy="130" r="4"/><circle cx="83"  cy="105" r="4"/><circle cx="98"  cy="85" r="4"/>
      <circle cx="120" cy="70"  r="4"/><circle cx="145" cy="63" r="4"/><circle cx="175" cy="62" r="4"/>
      <circle cx="200" cy="63"  r="4"/><circle cx="225" cy="65" r="4"/><circle cx="250" cy="70" r="4"/>
      <circle cx="275" cy="78"  r="4"/><circle cx="297" cy="90" r="4"/><circle cx="315" cy="107" r="4"/>
      <circle cx="325" cy="130" r="4"/><circle cx="318" cy="152" r="4"/><circle cx="305" cy="170" r="4"/>
      <circle cx="285" cy="184" r="4"/><circle cx="260" cy="193" r="4"/><circle cx="230" cy="198" r="4"/>
      <circle cx="200" cy="200" r="4"/><circle cx="170" cy="198" r="4"/><circle cx="140" cy="193" r="4"/>
      <circle cx="115" cy="184" r="4"/><circle cx="95"  cy="170" r="4"/><circle cx="82" cy="152" r="4"/>
    </g>
    <!-- Central necrosis (amorphous tan) -->
    <ellipse cx="200" cy="130" rx="95" ry="45" fill="#fca5a5" opacity="0.9"/>
    <!-- Calcifications (dark dots) -->
    <g fill="#450a0a">
      <circle cx="160" cy="115" r="3"/>
      <circle cx="175" cy="128" r="2.5"/>
      <circle cx="195" cy="120" r="3"/>
      <circle cx="215" cy="135" r="2.5"/>
      <circle cx="235" cy="122" r="3"/>
      <circle cx="250" cy="140" r="2.5"/>
      <circle cx="185" cy="150" r="3"/>
      <circle cx="220" cy="152" r="2.5"/>
    </g>
  </g>
  <text x="20" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">扩张导管内中央可见嗜酸性颗粒状坏死物与粗大钙化（深色斑点），高级别 DCIS 典型表现</text>
</svg>
