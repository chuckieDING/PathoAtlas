<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-label="Signet ring cells">
  <rect width="400" height="240" fill="#fdf4ef"/>
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#dc2626">印戒细胞 · Signet ring cells</text>
  <g>
    <!-- Each signet cell: large circle (mucin) with eccentric nucleus -->
    <g fill="#fde68a" stroke="#dc2626" stroke-width="2">
      <circle cx="80" cy="110" r="22"/>
      <circle cx="150" cy="85" r="20"/>
      <circle cx="210" cy="130" r="24"/>
      <circle cx="280" cy="95" r="20"/>
