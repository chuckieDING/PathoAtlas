      <path d="M94 102 Q104 100 102 118 Q92 116 94 102 Z"/>
      <path d="M164 80 Q172 78 170 94 Q160 94 164 80 Z"/>
      <path d="M228 122 Q236 120 234 140 Q222 140 228 122 Z"/>
      <path d="M294 90 Q302 88 300 104 Q290 104 294 90 Z"/>
      <path d="M354 130 Q362 128 360 146 Q350 146 354 130 Z"/>
      <path d="M124 170 Q132 168 130 184 Q120 184 124 170 Z"/>
      <path d="M214 190 Q222 188 220 206 Q210 206 214 190 Z"/>
      <path d="M298 182 Q306 180 304 196 Q294 196 298 182 Z"/>
    </g>
  </g>
  <text x="20" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">胞浆内充满粘液，将细胞核推向一侧形成印戒样外观</text>
</svg>
